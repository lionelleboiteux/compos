<style>
  :root {
    /* fantasy-coach.fr's own blue (reused from pronos.fantasy-coach.fr and
       l1.dnp.fantasy-coach.fr) so this page reads as part of the same site. */
    --fc-blue: #3d9be9;
    --fc-blue-light: #63b0ee;
    --bg: #ffffff;
    --card: #ffffff;
    --ink: #1c1917;
    --muted: #6b6560;
    --border: #d6d3d1;
    --accent: var(--fc-blue);
    --accent-ink: #ffffff;
    --pitch-top: #4caf62;
    --pitch-bottom: #2e7d3f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0 1rem 1rem;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  .site-footer { text-align: center; font-size: 0.8rem; color: var(--muted); margin: 2.5rem 0 1rem; }
  main { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0.5rem 0 1rem; }
  .intro { margin-bottom: 1.25rem; }
  .intro p { margin: 0.5rem 0; }
  .journee-picker { margin-bottom: 1.5rem; }
  .journee-picker label { display: block; font-weight: 600; margin-bottom: 0.4rem; }
  .journee-picker-row {
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .journee-picker select {
    width: 100%;
    max-width: 320px;
    padding: 0.55rem 0.7rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--ink);
    font-size: 1rem;
  }
  /* Gameweek-wide accuracy score, next to the picker — deliberately much
     bigger than any other text on the page, it's the headline number. */
  .gameweek-score {
    flex: none;
    font-size: clamp(1.8rem, 6vw, 2.6rem);
    font-weight: 800;
    color: var(--fc-blue);
    line-height: 1;
  }
  .status-line { color: var(--muted); font-size: 0.9rem; margin: 0.5rem 0 1rem; }
  /* One card per team, cards fill the row on wide screens since a pitch
     diagram needs real width to stay readable — unlike DNP's list rows,
     which work fine full-width-stacked at any size. */
  .team-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1rem;
  }
  @media (min-width: 640px) {
    .team-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (min-width: 960px) {
    .team-grid { grid-template-columns: repeat(3, 1fr); }
  }
  .team-card {
    display: flex;
    flex-direction: column;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.9rem 1rem 1rem;
  }
  .team-header {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    font-size: 1.05rem;
    margin: 0 0 0.75rem;
    padding-bottom: 0.5rem;
    border-bottom: 2px solid var(--accent);
  }
  .team-logo {
    flex: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    object-fit: contain;
  }
  .team-logo-fallback {
    flex: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-ink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.68rem;
    font-weight: 700;
  }
  .team-name { flex: 1; font-weight: 700; }
  /* Per-team accuracy mark, right after the team name — styled like a
     hand-scrawled grade (bigger, bold, tilted) rather than a normal badge.
     Only present once "actuelles" has a result recorded for this team. */
  .team-score {
    flex: none;
    font-size: 1.5rem;
    font-weight: 800;
    color: #d92b2b;
    transform: rotate(-8deg);
    display: inline-block;
    line-height: 1;
  }
  .team-formation {
    flex: none;
    background: #eaf3fc;
    color: var(--fc-blue);
    font-weight: 700;
    font-size: 0.78rem;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
  }
  /* Pitch: a vertical strip (goalkeeper's own goal at the bottom, attack at
     the top — mirrors how lineup graphics are usually drawn) built entirely
     from CSS gradients/borders, no image assets. */
  .pitch {
    position: relative;
    background: linear-gradient(180deg, var(--pitch-top) 0%, var(--pitch-bottom) 100%);
    border-radius: 10px;
    padding: 0.85rem 0.4rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 0.5rem;
    min-height: 300px;
    /* Grows to fill whatever height the grid stretched .team-card to (all
       cards in a row match the tallest), so formations with fewer lines
       (e.g. 4-3-3) get a taller pitch rather than a shorter card. */
    flex: 1;
    overflow: hidden;
  }
  .pitch::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 6%;
    right: 6%;
    height: 2px;
    background: rgba(255, 255, 255, 0.45);
  }
  .pitch::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 64px;
    height: 64px;
    border: 2px solid rgba(255, 255, 255, 0.45);
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  .pitch-line {
    position: relative;
    z-index: 1;
    display: flex;
    /* Clustered around the center, not spread edge-to-edge: space-evenly
       equalizes the gaps between item *edges*, which looks off-center once
       labels have different widths (a line with one long name and one short
       name visibly leans). Centering the group avoids that regardless of
       label length. */
    justify-content: center;
    align-items: flex-start;
    gap: clamp(0.3rem, 2vw, 1.1rem);
  }
  .player-chip {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.2rem;
    /* Fixed width, not content-based: a chip with a long/wrapping label
       (e.g. "Rabillard (Colas)") must not be visually wider than a chip
       with a short one, or the shirts stop being evenly spaced relative to
       each other even though the row as a whole is still centered.
       flex-shrink allowed as a safety net on very narrow screens. */
    flex: 0 1 3.4rem;
    min-width: 0;
    width: 3.4rem;
  }
  .player-shirt {
    width: 1.9rem;
    height: 1.9rem;
    flex: none;
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.45));
  }
  .player-label {
    color: #ffffff;
    font-size: 0.68rem;
    font-weight: 600;
    text-align: center;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    overflow-wrap: anywhere;
  }
  .empty-state, .error-state {
    text-align: center;
    color: var(--muted);
    padding: 2rem 1rem;
    border: 1px dashed var(--border);
    border-radius: 12px;
  }
  .error-state { color: #b91c1c; }
</style>

<script>
(function () {
  // ?api=<url> overrides the default for local/dev testing only; never
  // persisted, so production use is unaffected. Same convention as
  // pronos.fantasy-coach.fr's and l1.dnp.fantasy-coach.fr's frontends.
  var API_BASE = new URLSearchParams(location.search).get('api') ||
    'https://script.google.com/macros/s/AKfycby7k1DeAKMJFeSLMCHtQntyU0hGseKmN4ZMxuMMDjugFTh-H4wTNvk5TA32CM5By7aMng/exec';

  var select = document.getElementById('journee-select');
  var statusLine = document.getElementById('status-line');
  var teamGrid = document.getElementById('team-grid');
  var gameweekScoreEl = document.getElementById('gameweek-score');

  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    for (var k in (attrs || {})) {
      if (k === 'text') e.textContent = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) { e.appendChild(c); });
    return e;
  }

  function setStatus(text) {
    statusLine.textContent = text || '';
  }

  // The Apps Script web app's container spins down when idle, so the first
  // request after a quiet period can hang for 10-40s or come back as a
  // Google error page (non-JSON) instead of reaching the script at all —
  // observed directly against this deployment, not a hypothetical. A couple
  // of quick retries rides out that cold start instead of showing an error
  // for what is, from the second attempt on, usually a sub-second response.
  function fetchJson_(url, attemptsLeft, delayMs) {
    return fetch(url)
      .then(function (r) { return r.json(); })
      .catch(function (err) {
        if (attemptsLeft <= 1) throw err;
        return new Promise(function (resolve) { setTimeout(resolve, delayMs); })
          .then(function () { return fetchJson_(url, attemptsLeft - 1, delayMs * 2); });
      });
  }

  // Sourced from the pronos Supabase `teams` table (same account/project as
  // pronos.fantasy-coach.fr) — copied verbatim from l1.dnp.fantasy-coach.fr's
  // frontend, which already curated it by hand against real team names.
  // Metz and Nantes aren't in that table (it has stale entries for Troyes/Le
  // Mans FC instead, from before a promotion/relegation cycle) — those two
  // fall back to the initials badge below until a source for them is
  // supplied.
  var TEAM_LOGOS = {
    'Angers': 'https://s3.eu-west-1.amazonaws.com/image.mpg/assets/clubs/logo/2023_4_37_512x512_b5149d8c4312c158b2975298205510eb.png',
    'Auxerre': 'https://s3.eu-west-1.amazonaws.com/image.mpg/assets/clubs/logo/2023_4_2_512x512_4bed22ddd777a8b0977284bee7f416a7.png',
    'Brest': 'https://s3.eu-west-1.amazonaws.com/image.mpg/assets/clubs/logo/2023_1_44_512x512_b8930455bc938de7b9f4e128e1036989.png',
    'Le Havre': 'https://s3.eu-west-1.amazonaws.com/image.mpg/assets/clubs/logo/2023_1_5_512x512_e9bf970697e022dcbd3d51e245f3682d.png',
    'Lens': 'https://s3.eu-west-1.amazonaws.com/image.mpg/assets/clubs/logo/2026_1_6_512x512_d08b45acce8a87d13b938cde8974362f.png',
    'Lille': 'https://s3.eu-west-1.amazonaws.com/image.mpg/assets/clubs/logo/2023_1_158_512x512_39a605746d9cf4eb12d9cd4f63adb27c.png',
    'Lorient': 'https://s3.eu-west-1.amazonaws.com/image.mpg/assets/clubs/logo/2023_1_7_512x512_7d0c497c5f41d0dcf5dabad2910699e3.png',
    'Lyon': 'https://s3.eu-west-1.amazonaws.com/image.mpg/assets/clubs/logo/2023_1_159_512x512_1a9c2cd8f58fba433bb5cd568b3de7d0.png',
    'Marseille': 'https://s3.eu-west-1.amazonaws.com/image.mpg/assets/clubs/logo/2025_1_1_512x512_16ca4f08072a6b6d99169ba2b6a8b228.png',
    'Monaco': 'https://s3.eu-west-1.amazonaws.com/image.mpg/assets/clubs/logo/2023_1_9_512x512_ad7dd146950eee8eb68ea9588a674fe8.png',
    'Nice': 'https://s3.eu-west-1.amazonaws.com/image.mpg/assets/clubs/logo/2023_1_30_512x512_2ccb89a2f1fbad23e693d1c5d101a25d.png',
    'Paris FC': 'https://s3.eu-west-1.amazonaws.com/image.mpg/assets/clubs/logo/2023_4_90_512x512_8b2bb52cf67eb9456c794509c7e58c46.png',
    'Paris SG': 'https://s3.eu-west-1.amazonaws.com/image.mpg/assets/clubs/logo/2023_1_13_512x512_4a9438034a011c1368c52d097a93b98f.png',
    'Rennes': 'https://s3.eu-west-1.amazonaws.com/image.mpg/assets/clubs/logo/2023_1_14_512x512_28c7492293ca34c6e26d6cb71e858a57.png',
    'Strasbourg': 'https://s3.eu-west-1.amazonaws.com/image.mpg/assets/clubs/logo/2023_1_15_512x512_e9553990e86d8098a3cf94febe8b4b96.png',
    'Toulouse': 'https://s3.eu-west-1.amazonaws.com/image.mpg/assets/clubs/logo/2023_1_16_512x512_a7be4e575396227614acc0ed47083503.png',
    // Troyes and Le Mans are this season's promoted clubs (confirmed
    // directly against pronos' live team data), replacing Metz/Nantes from
    // the table DNP's map was originally built against.
    'Troyes': 'https://s3.eu-west-1.amazonaws.com/image.mpg/assets/clubs/logo/2023_4_33_512x512_fa84337aa111aaf34990dd2590ba1789.png',
    'Estac Troyes': 'https://s3.eu-west-1.amazonaws.com/image.mpg/assets/clubs/logo/2023_4_33_512x512_fa84337aa111aaf34990dd2590ba1789.png',
    'Le Mans': 'https://s3.eu-west-1.amazonaws.com/image.mpg/daabb8d9-230e-4fe2-8214-682fbbdedb5e',
    'Le Mans FC': 'https://s3.eu-west-1.amazonaws.com/image.mpg/daabb8d9-230e-4fe2-8214-682fbbdedb5e'
  };

  // Approximate primary shirt colors, hand-picked for visual variety — not
  // sourced from an API (no team-color data exists anywhere we pull from),
  // so treat as decorative rather than official brand hex codes. Easy to
  // tweak here if a color looks off.
  var TEAM_COLORS = {
    'Angers': '#111111',
    'Auxerre': '#1c3f8f',
    'Brest': '#dc1f26',
    'Le Havre': '#0072ce',
    'Lens': '#c8102e',
    'Lille': '#d0021b',
    'Lorient': '#ff6600',
    'Lyon': '#002e62',
    'Marseille': '#1a7dc4',
    'Monaco': '#cc0000',
    'Nice': '#1c1c1c',
    'Paris FC': '#0033a0',
    'Paris SG': '#04234c',
    'Rennes': '#e2001a',
    'Strasbourg': '#0055a4',
    'Toulouse': '#6a0dad',
    'Troyes': '#002868',
    'Estac Troyes': '#002868',
    'Le Mans': '#009fe3',
    'Le Mans FC': '#009fe3'
  };
  var DEFAULT_SHIRT_COLOR = '#9ca3af';
  // Goalkeepers traditionally wear a shirt distinct from the rest of the
  // team (no per-team "keeper kit" color data exists anywhere we pull
  // from, so this is one fixed neutral color for every team rather than
  // an attempt at per-team accuracy).
  var GK_SHIRT_COLOR = '#f2c40c';

  var SVG_NS = 'http://www.w3.org/2000/svg';
  // Simple short-sleeve jersey silhouette (shoulders + V-neck notch) in a
  // 24x24 box — hand-built from primitives rather than a traced icon, so no
  // external asset/license to track.
  var SHIRT_PATH = 'M2,4 L8,2 L10,4 L14,4 L16,2 L22,4 L18,8 L18,22 L6,22 L6,8 Z';

  function shirtIcon(color) {
    var svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('class', 'player-shirt');
    svg.setAttribute('viewBox', '0 0 24 24');
    var path = document.createElementNS(SVG_NS, 'path');
    path.setAttribute('d', SHIRT_PATH);
    path.setAttribute('fill', color || DEFAULT_SHIRT_COLOR);
    path.setAttribute('stroke', '#ffffff');
    path.setAttribute('stroke-width', '1');
    path.setAttribute('stroke-linejoin', 'round');
    svg.appendChild(path);
    return svg;
  }

  function teamInitials(equipe) {
    return String(equipe || '?')
      .split(/\s+/)
      .map(function (w) { return w[0]; })
      .join('')
      .slice(0, 3)
      .toUpperCase();
  }

  // "4-3-3" -> [4, 3, 3]. Returns null if any part isn't a positive
  // integer, so the caller can fall back to a single undifferentiated line.
  function parseFormationLines(formation) {
    var parts = String(formation || '').split('-').map(function (p) { return parseInt(p, 10); });
    if (parts.length === 0 || parts.some(function (n) { return !n || n <= 0; })) return null;
    return parts;
  }

  function renderLine(names, color) {
    var line = el('div', { class: 'pitch-line' });
    // Sheet order within a line is entered right-to-left (e.g. for
    // defenders, J2 = right-back ... J5 = left-back), but DOM/flexbox
    // order renders left-to-right, so reverse to match.
    names.slice().reverse().forEach(function (name) {
      var chip = el('div', { class: 'player-chip' });
      chip.appendChild(shirtIcon(color));
      chip.appendChild(el('span', { class: 'player-label', text: name }));
      line.appendChild(chip);
    });
    return line;
  }

  function renderPitch(team) {
    var joueurs = team.joueurs || [];
    var gk = joueurs[0];
    var outfield = joueurs.slice(1);
    var lines = parseFormationLines(team.formation);
    var sum = lines ? lines.reduce(function (a, b) { return a + b; }, 0) : 0;
    var color = TEAM_COLORS[team.equipe] || DEFAULT_SHIRT_COLOR;

    var pitch = el('div', { class: 'pitch' });

    if (lines && sum === outfield.length) {
      // Attackers (last formation number) nearest the top of the pitch,
      // defenders nearest the goalkeeper at the bottom.
      var idx = 0;
      var groups = lines.map(function (n) {
        var g = outfield.slice(idx, idx + n);
        idx += n;
        return g;
      });
      groups.slice().reverse().forEach(function (g) { pitch.appendChild(renderLine(g, color)); });
    } else if (outfield.length) {
      // Formation string missing/malformed/inconsistent with the player
      // count — fall back to one undifferentiated line rather than guessing.
      pitch.appendChild(renderLine(outfield, color));
    }

    pitch.appendChild(renderLine(gk ? [gk] : [], GK_SHIRT_COLOR));
    return pitch;
  }

  function renderTeams(teams) {
    teamGrid.innerHTML = '';
    if (!teams || teams.length === 0) {
      teamGrid.appendChild(el('div', { class: 'empty-state', text: 'Aucune composition disponible pour cette journée.' }));
      return;
    }
    teams.forEach(function (team) {
      var card = el('div', { class: 'team-card' });
      var header = el('div', { class: 'team-header' });
      var logoUrl = TEAM_LOGOS[team.equipe];
      if (logoUrl) {
        var logo = el('img', { class: 'team-logo', src: logoUrl, alt: team.equipe });
        logo.addEventListener('error', function () {
          this.replaceWith(el('span', { class: 'team-logo-fallback', text: teamInitials(team.equipe) }));
        });
        header.appendChild(logo);
      } else {
        header.appendChild(el('span', { class: 'team-logo-fallback', text: teamInitials(team.equipe) }));
      }
      header.appendChild(el('span', { class: 'team-name', text: team.equipe }));
      if (team.score) header.appendChild(el('span', { class: 'team-score', text: team.score.correct + '/' + team.score.total }));
      if (team.formation) header.appendChild(el('span', { class: 'team-formation', text: team.formation }));
      card.appendChild(header);
      card.appendChild(renderPitch(team));
      teamGrid.appendChild(card);
    });
  }

  function renderGameweekScore(score) {
    gameweekScoreEl.textContent = score ? score.percent + '%' : '';
  }

  function loadJournee(journee) {
    setStatus('Chargement…');
    teamGrid.innerHTML = '';
    renderGameweekScore(null);
    fetchJson_(API_BASE + '?journee=' + encodeURIComponent(journee), 3, 2000)
      .then(function (data) {
        if (data && data.error) throw new Error(data.error);
        setStatus('');
        renderTeams(data.equipes);
        renderGameweekScore(data.score);
      })
      .catch(function (err) {
        setStatus('');
        teamGrid.appendChild(el('div', { class: 'error-state', text: 'Impossible de charger les données (' + err.message + ').' }));
      });
  }

  // jeu-des-pronos already tracks which Ligue 1 gameweek is current (locks
  // open/close around kickoffs); reuse that instead of guessing from
  // whichever journée happens to be filled in furthest — same approach as
  // l1.dnp.fantasy-coach.fr's frontend.
  var PRONOS_API_BASE = 'https://dmytkubjxwwwkroutvdu.supabase.co/functions/v1/api';
  var PRONOS_L1_LEAGUE_ID = '27f27a15-02a9-448a-98d5-80998e2fa52e';

  function fetchCurrentGameweekNumber() {
    return fetch(PRONOS_API_BASE + '/v1/leagues/' + PRONOS_L1_LEAGUE_ID + '/current')
      .then(function (r) { return r.json(); })
      .then(function (data) { return data && data.gameweek ? data.gameweek.number : null; })
      .catch(function () { return null; });
  }

  Promise.all([
    fetchJson_(API_BASE + '?meta=1', 3, 2000),
    fetchCurrentGameweekNumber()
  ])
    .then(function (results) {
      var journees = results[0];
      var currentNumber = results[1];
      select.innerHTML = '';
      journees.forEach(function (j) {
        select.appendChild(el('option', { value: j, text: j }));
      });
      select.disabled = false;
      select.addEventListener('change', function () { loadJournee(select.value); });

      // 'Compos' is free text a teammate fills in by hand -- observed to be
      // just "1", "2", ... this season rather than "Journée N" (same
      // tolerance as apps-script/Code.gs's gameweekNumberFromJournee_) -- so
      // match by extracted number, not by rebuilding a "Journée N" string
      // that would never equal a bare "3" and always fall through below.
      var defaultJournee = currentNumber != null
        ? journees.filter(function (j) { return parseInt(String(j).match(/\d+/), 10) === currentNumber; })[0]
        : null;
      if (!defaultJournee) {
        defaultJournee = journees.length ? journees[0] : null;
      }
      if (defaultJournee) {
        select.value = defaultJournee;
        loadJournee(defaultJournee);
      } else {
        select.appendChild(el('option', { text: 'Aucune journée disponible' }));
        select.disabled = true;
        teamGrid.appendChild(el('div', { class: 'empty-state', text: 'Aucune composition n’a encore été renseignée.' }));
      }
    })
    .catch(function (err) {
      select.innerHTML = '';
      select.appendChild(el('option', { text: 'Erreur de chargement' }));
      teamGrid.appendChild(el('div', { class: 'error-state', text: 'Impossible de charger la liste des journées (' + err.message + ').' }));
    });
})();
</script>
</body>
</html>
