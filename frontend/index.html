<style>
  :root {
    /* fantasy-coach.fr's own blue (reused from pronos.fantasy-coach.fr and
       l1.dnp.fantasy-coach.fr) so this page reads as part of the same site. */
    --fc-blue: #3d9be9;
    --fc-blue-light: #63b0ee;
    --bg: #ffffff;
    --card: #ffffff;
    --ink: #1c1917;
    --muted: #6b6560;
    --border: #d6d3d1;
    --accent: var(--fc-blue);
    --accent-ink: #ffffff;
    --pitch-top: #4caf62;
    --pitch-bottom: #2e7d3f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0 1rem 1rem;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  .site-footer { text-align: center; font-size: 0.8rem; color: var(--muted); margin: 2.5rem 0 1rem; }
  main { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0.5rem 0 1rem; }
  .intro { margin-bottom: 1.25rem; }
  .intro p { margin: 0.5rem 0; }
  .journee-picker { margin-bottom: 1.5rem; }
  .journee-picker label { display: block; font-weight: 600; margin-bottom: 0.4rem; }
  .journee-picker-row {
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .journee-picker select {
    width: 100%;
    max-width: 320px;
    padding: 0.55rem 0.7rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--ink);
    font-size: 1rem;
  }
  /* Gameweek-wide accuracy score, next to the picker — deliberately much
     bigger than any other text on the page, it's the headline number. */
  .gameweek-score {
    flex: none;
    font-size: clamp(1.8rem, 6vw, 2.6rem);
    font-weight: 800;
    color: var(--fc-blue);
    line-height: 1;
  }
  .status-line { color: var(--muted); font-size: 0.9rem; margin: 0.5rem 0 1rem; }
  /* Freshness indicator for the currently-loaded journée's data (see
     Code.gs's lastUpdatedIso_) — the label stays modest, the timestamp
     itself is the part worth noticing so it's set apart in size/weight. */
  .last-updated {
    margin: 0 0 1.25rem;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .last-updated-time {
    margin-left: 0.4rem;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--ink);
  }
  /* Explains the two on-shirt badges (see .penalty-badge/.captain-badge)
     once, above the results, rather than repeating a label on every shirt. */
  .badge-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 1.25rem;
    align-items: center;
    margin: 0 0 1rem;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 0.45rem;
  }
  /* A small pitch-colored swatch stands in for the shirt so the badges
     read the same way here as they do in the diagrams below. */
  .legend-swatch {
    flex: none;
    width: 1.7rem;
    height: 1.7rem;
    border-radius: 6px;
    background: var(--pitch-bottom);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .legend-badge-penalty {
    width: 1.05rem;
    height: auto;
  }
  .legend-badge-captain {
    width: 0.95rem;
    height: auto;
    background: #ffffff;
    border-radius: 2px;
    padding: 0.05rem;
  }
  /* One section per matchday (Vendredi/Samedi/Dimanche, ...), each holding
     its own .match-list — lets a visitor scan straight to "who plays when"
     for live-substitute timing instead of hunting a flat list. */
  .day-section + .day-section { margin-top: 2rem; }
  .day-heading {
    font-size: 1.05rem;
    font-weight: 700;
    margin: 0 0 0.85rem;
    padding-bottom: 0.4rem;
    border-bottom: 1px solid var(--border);
  }
  .match-list { display: flex; flex-direction: column; gap: 1.5rem; }
  .match-card {
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    background: var(--card);
  }
  .match-kickoff {
    text-align: center;
    font-size: 0.78rem;
    color: var(--muted);
    padding: 0.4rem 0.5rem;
    background: #f5f4f2;
    border-bottom: 1px solid var(--border);
  }
  /* Mobile (default): each team's heading and its DNP capsule share a row
     (heading left, capsule right), stacked home-row/pitch/away-row.
     Desktop (see the min-width query below): headings become full-width
     bars above/below the pitch; only the capsules move into a column on
     the pitch's right, each vertically aligned with its own half. Heading
     and capsule are separate grid items (not nested) precisely so this
     regrouping is just a change of grid-template-areas, no DOM change.
     Ported from presentations' .match-body. */
  .match-body {
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-areas:
      "home-heading home-capsule"
      "pitch pitch"
      "away-heading away-capsule";
    align-items: start;
  }
  .team-heading-home { grid-area: home-heading; }
  .team-heading-away { grid-area: away-heading; }
  .team-capsule-home { grid-area: home-capsule; }
  .team-capsule-away { grid-area: away-capsule; }
  .match-body .pitch { grid-area: pitch; }
  .team-heading-home, .team-heading-away, .team-capsule-home, .team-capsule-away {
    padding: 0.6rem 0.75rem;
  }
  @media (min-width: 640px) {
    .match-body {
      grid-template-columns: 1fr minmax(200px, 260px);
      grid-template-rows: auto 1fr 1fr auto;
      grid-template-areas:
        "home-heading home-heading"
        "pitch home-capsule"
        "pitch away-capsule"
        "away-heading away-heading";
    }
  }
  .team-header {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    font-weight: 700;
    min-width: 0;
  }
  .team-header-top {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    min-width: 0;
  }
  .team-logo {
    flex: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    object-fit: contain;
  }
  .team-logo-fallback {
    flex: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-ink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.68rem;
    font-weight: 700;
  }
  .team-name {
    flex: 1;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* Full name at desktop, short/town name at mobile -- both rendered,
     CSS picks which shows (ported from presentations). */
  .team-name-full { display: none; }
  @media (min-width: 640px) {
    .team-name-short { display: none; }
    .team-name-full { display: inline; }
  }
  .team-formation {
    flex: none;
    background: #eaf3fc;
    color: var(--fc-blue);
    font-weight: 700;
    font-size: 0.78rem;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
  }
  /* DNP capsule: a compact link-wrapped card, simplified (icon + Lastname
     F. only) -- the full detail (blessure/suspendu/... reason, expected
     return) lives on l1.dnp.fantasy-coach.fr itself, which the capsule
     links to. Ported from presentations. */
  .dnp-capsule {
    display: block;
    text-decoration: none;
    color: inherit;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.35rem 0.55rem;
    background: #faf9f8;
  }
  @media (min-width: 480px) {
    .dnp-capsule { max-width: 11rem; }
  }
  .dnp-capsule:hover { border-color: var(--accent); background: #f2f8fd; }
  .dnp-capsule-empty {
    font-size: 0.72rem;
    color: var(--muted);
  }
  .dnp-capsule-player {
    display: flex;
    align-items: center;
    gap: 0.3rem;
    font-size: 0.72rem;
    line-height: 1.35;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .dnp-capsule-icon { flex: none; font-size: 0.8rem; line-height: 1; }
  /* Plain "+" styled in CSS, not an emoji, for the "blessure" icon -- same
     as l1.dnp.fantasy-coach.fr's frontend. */
  .dnp-capsule-icon.icon-blessure { color: #dc2626; font-weight: 800; font-size: 1rem; }
  /* Per-team accuracy mark, drawn over the pitch's own top-left/bottom-left
     corners (see renderMatchCard_) rather than in a header row, since both
     teams now share one pitch -- styled like a hand-scrawled grade
     (bigger, bold, tilted) rather than a normal badge. Only present once
     "actuelles" has a result recorded for that team. */
  .team-score {
    position: absolute;
    z-index: 2;
    left: 0.4rem;
    font-size: 1.5rem;
    font-weight: 800;
    color: #d92b2b;
    transform: rotate(-8deg);
    line-height: 1;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
  }
  .pitch-score-home { top: 0.3rem; }
  .pitch-score-away { bottom: 0.3rem; }
  /* Pitch: home team's own goal at the very top, away team's own goal at
     the very bottom, both attacking toward the shared halfway line/center
     circle in the middle -- one continuous strip, not two separate mini
     pitches. Ported from presentations. */
  .pitch {
    position: relative;
    background: linear-gradient(180deg, var(--pitch-top) 0%, var(--pitch-bottom) 100%);
    padding: 0.85rem 0.4rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 0.5rem;
    min-height: 520px;
    overflow: hidden;
  }
  .pitch::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 6%;
    right: 6%;
    height: 2px;
    background: rgba(255, 255, 255, 0.45);
  }
  .pitch::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 64px;
    height: 64px;
    border: 2px solid rgba(255, 255, 255, 0.45);
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  .pitch-half {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .pitch-line {
    position: relative;
    z-index: 1;
    display: flex;
    /* Clustered around the center, not spread edge-to-edge: space-evenly
       equalizes the gaps between item *edges*, which looks off-center once
       labels have different widths (a line with one long name and one short
       name visibly leans). Centering the group avoids that regardless of
       label length. */
    justify-content: center;
    align-items: flex-start;
    gap: clamp(0.3rem, 2vw, 1.1rem);
  }
  .player-chip {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.2rem;
    /* Width follows the label instead of a fixed 3.4rem: a long label like
       "Sahraoui (Onal)" needs the extra room to stay on one line, and
       letting the chip grow to fit it (rather than wrapping/truncating)
       reads better than keeping every chip the same width. The row is
       still centered as a whole via justify-content on .pitch-line, so
       uneven chip widths don't unbalance the layout. */
    flex: 0 1 auto;
    min-width: 3.4rem;
  }
  /* Wraps the shirt so badges (penalty taker, and later captain) can be
     absolutely positioned over its corners without disturbing the
     shirt+label column layout in .player-chip. */
  .player-shirt-wrap {
    position: relative;
    width: 1.9rem;
    height: 1.9rem;
    flex: none;
  }
  .player-shirt {
    width: 1.9rem;
    height: 1.9rem;
    flex: none;
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.45));
  }
  /* Bottom-right corner (the hem) of the shirt — the captain armband sits
     on the opposite corner (the sleeve, top-left), so a player with both
     never has the badges collide. */
  .penalty-badge {
    position: absolute;
    right: -0.45rem;
    bottom: -0.15rem;
    width: 0.95rem;
    height: auto;
    filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.6));
  }
  /* Captain armband, worn on the sleeve (the shirt's top-left corner in
     SHIRT_PATH). The icon is a black silhouette with no shirt-color-aware
     styling of its own, so it gets a small white backing here — the same
     reason the shirt itself is drawn with a white stroke — to stay visible
     against dark kits (navy, black, purple, ...). */
  .captain-badge {
    position: absolute;
    left: -0.25rem;
    top: -0.1rem;
    width: 0.9rem;
    height: auto;
    background: #ffffff;
    border-radius: 2px;
    padding: 0.03rem;
    filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.5));
  }
  .player-label {
    color: #ffffff;
    font-size: 0.68rem;
    font-weight: 600;
    text-align: center;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    white-space: nowrap;
  }
  .empty-state, .error-state {
    text-align: center;
    color: var(--muted);
    padding: 2rem 1rem;
    border: 1px dashed var(--border);
    border-radius: 12px;
  }
  .error-state { color: #b91c1c; }
</style>

<script>
(function () {
  // ?api=<url> overrides the default for local/dev testing only; never
  // persisted, so production use is unaffected. Same convention as
  // pronos.fantasy-coach.fr's and l1.dnp.fantasy-coach.fr's frontends.
  //
  // Default points at the Cloudflare Worker cache (worker/), not the Apps
  // Script /exec URL directly -- the Worker mirrors that same API from
  // Workers KV, so ordinary visits skip Apps Script's cold-start entirely.
  // The Apps Script URL is still reachable directly via ?api=<that URL>
  // for debugging (e.g. to check whether a discrepancy is the Worker's
  // cache being stale vs. Apps Script itself misbehaving).
  var API_BASE = new URLSearchParams(location.search).get('api') ||
    'https://compos-l1-cache.fantasycoachfr.workers.dev';
  // DNP's own Worker cache -- this page now also pulls in each team's
  // unavailable-player capsule, ported from the sibling presentations
  // project (see buildMatches_/renderDnpCapsule_ below). ?api_dnp=<url>
  // overrides it the same way ?api= overrides API_BASE above.
  var API_BASE_DNP = new URLSearchParams(location.search).get('api_dnp') ||
    'https://dnp-l1-cache.fantasycoachfr.workers.dev';
  var DNP_SITE_URL = 'https://l1.dnp.fantasy-coach.fr/';

  var select = document.getElementById('journee-select');
  var statusLine = document.getElementById('status-line');
  var matchList = document.getElementById('match-list');
  var gameweekScoreEl = document.getElementById('gameweek-score');
  var lastUpdatedEl = document.getElementById('last-updated');

  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    for (var k in (attrs || {})) {
      if (k === 'text') e.textContent = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) { e.appendChild(c); });
    return e;
  }

  function setStatus(text) {
    statusLine.textContent = text || '';
  }

  // The Apps Script web app's container spins down when idle, so the first
  // request after a quiet period can hang for 10-40s or come back as a
  // Google error page (non-JSON) instead of reaching the script at all —
  // observed directly against this deployment, not a hypothetical. A couple
  // of quick retries rides out that cold start instead of showing an error
  // for what is, from the second attempt on, usually a sub-second response.
  function fetchJson_(url, attemptsLeft, delayMs) {
    return fetch(url)
      .then(function (r) { return r.json(); })
      .catch(function (err) {
        if (attemptsLeft <= 1) throw err;
        return new Promise(function (resolve) { setTimeout(resolve, delayMs); })
          .then(function () { return fetchJson_(url, attemptsLeft - 1, delayMs * 2); });
      });
  }

  // Simple short-sleeve jersey silhouette (shoulders + V-neck notch) in a

  // Two-tone jersey: a solid main-color fill, an optional secondary color
  // drawn as a diagonal "/" sash (a rotated band clipped to the jersey
  // silhouette), then a white outline redrawn on top so the silhouette
  // still reads clearly against both colors. Ported from presentations'
  // shirtIcon.
  function shirtIcon(colorPair) {
    var pair = colorPair || DEFAULT_SHIRT_COLOR;
    var svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('class', 'player-shirt');
    svg.setAttribute('viewBox', '0 0 24 24');

    var clipId = 'shirt-clip-' + (shirtClipCounter_++);
    var defs = document.createElementNS(SVG_NS, 'defs');
    var clipPath = document.createElementNS(SVG_NS, 'clipPath');
    clipPath.setAttribute('id', clipId);
    var clipShape = document.createElementNS(SVG_NS, 'path');
    clipShape.setAttribute('d', SHIRT_PATH);
    clipPath.appendChild(clipShape);
    defs.appendChild(clipPath);
    svg.appendChild(defs);

    var basePath = document.createElementNS(SVG_NS, 'path');
    basePath.setAttribute('d', SHIRT_PATH);
    basePath.setAttribute('fill', pair.main || DEFAULT_SHIRT_COLOR.main);
    svg.appendChild(basePath);

    if (pair.second) {
      var sashGroup = document.createElementNS(SVG_NS, 'g');
      sashGroup.setAttribute('clip-path', 'url(#' + clipId + ')');
      var sash = document.createElementNS(SVG_NS, 'rect');
      sash.setAttribute('x', '-10');
      sash.setAttribute('y', '9');
      sash.setAttribute('width', '44');
      sash.setAttribute('height', '7');
      sash.setAttribute('transform', 'rotate(-45 12 12)');
      sash.setAttribute('fill', pair.second);
      sashGroup.appendChild(sash);
      svg.appendChild(sashGroup);
    }

    var outline = document.createElementNS(SVG_NS, 'path');
    outline.setAttribute('d', SHIRT_PATH);
    outline.setAttribute('fill', 'none');
    outline.setAttribute('stroke', '#ffffff');
    outline.setAttribute('stroke-width', '1');
    outline.setAttribute('stroke-linejoin', 'round');
    svg.appendChild(outline);

    return svg;
  }

  // Static (independent of any journée's data), so it's rendered once at
  // startup rather than re-rendered on every loadJournee call.
  function renderBadgeLegend() {
    var legend = document.getElementById('badge-legend');
    if (!legend) return;
    legend.appendChild(el('div', { class: 'legend-item' }, [
      el('span', { class: 'legend-swatch' }, [
        el('img', { class: 'legend-badge-penalty', src: PENALTY_BADGE_SRC, alt: '' })
      ]),
      el('span', { text: 'Tireur de penalty désigné' })
    ]));
    legend.appendChild(el('div', { class: 'legend-item' }, [
      el('span', { class: 'legend-swatch' }, [
        el('img', { class: 'legend-badge-captain', src: CAPTAIN_BADGE_SRC, alt: '' })
      ]),
      el('span', { text: 'Capitaine' })
    ]));
  }
  renderBadgeLegend();

  // Ported from presentations' frontend/index.html verbatim.
  var REASON_ICON = {
    disponible: '✅',
    suspendu: '🟥',
    blessure: '+',
    personnel: '🤝',
    hors_groupe: '🙅',
    transfert: '✈️',
    incertain: '❓'
  };
  var REASON_LABEL = {
    disponible: 'Disponible',
    suspendu: 'Suspendu',
    blessure: 'Blessé',
    personnel: 'Raison personnelle',
    hors_groupe: 'Hors groupe',
    transfert: 'Transfert',
    incertain: 'Incertain'
  };

  // Simplified vs. l1.dnp.fantasy-coach.fr's own row (no poste/raison/retour
  // columns) -- icon + "Lastname F." only, full detail lives on the DNP
  // page itself, which the whole capsule links to.
  function formatPlayerName_(prenom, nom) {
    var initial = String(prenom || '').trim().charAt(0);
    return String(nom || '').trim() + (initial ? ' ' + initial + '.' : '');
  }

  // Display order: injured first (most clear-cut/impactful), then
  // suspended (equally certain), then out-of-group, personal reasons,
  // transfer, and finally the least certain (incertain) last. "disponible"
  // is filtered out entirely below -- this capsule is about who's
  // unavailable, not confirming who isn't.
  var REASON_ORDER = ['blessure', 'suspendu', 'hors_groupe', 'personnel', 'transfert', 'incertain'];

  function renderDnpCapsule_(joueurs) {
    var capsule = el('a', {
      class: 'dnp-capsule',
      href: DNP_SITE_URL,
      target: '_blank',
      rel: 'noopener',
      title: 'Voir le détail sur l1.dnp.fantasy-coach.fr'
    });
    var sorted = (joueurs || [])
      .filter(function (j) { return j.categorie !== 'disponible'; })
      .slice()
      .sort(function (a, b) {
        var ai = REASON_ORDER.indexOf(a.categorie);
        var bi = REASON_ORDER.indexOf(b.categorie);
        if (ai === -1) ai = REASON_ORDER.length;
        if (bi === -1) bi = REASON_ORDER.length;
        return ai - bi;
      });
    if (sorted.length === 0) {
      capsule.appendChild(el('span', { class: 'dnp-capsule-empty', text: 'Aucun indisponible connu' }));
      return capsule;
    }
    sorted.forEach(function (j) {
      var categorie = REASON_ICON.hasOwnProperty(j.categorie) ? j.categorie : 'incertain';
      var row = el('div', { class: 'dnp-capsule-player' });
      var iconClass = 'dnp-capsule-icon' + (categorie === 'blessure' ? ' icon-blessure' : '');
      row.appendChild(el('span', { class: iconClass, title: REASON_LABEL[categorie], text: REASON_ICON[categorie] }));
      row.appendChild(el('span', { text: formatPlayerName_(j.prenom, j.nom) }));
      capsule.appendChild(row);
    });
    return capsule;
  }

  function teamInitials(equipe) {
    return String(equipe || '?')
      .split(/\s+/)
      .map(function (w) { return w[0]; })
      .join('')
      .slice(0, 3)
      .toUpperCase();
  }

  // "4-3-3" -> [4, 3, 3]. Returns null if any part isn't a positive
  // integer, so the caller can fall back to a single undifferentiated line.
  function parseFormationLines(formation) {
    var parts = String(formation || '').split('-').map(function (p) { return parseInt(p, 10); });
    if (parts.length === 0 || parts.some(function (n) { return !n || n <= 0; })) return null;
    return parts;
  }

  // A standalone "(P)"/"(p)" or "(C)"/"(c)" bracket marks the penalty
  // taker or captain — distinct from the "Surname (Real Name)"
  // disambiguation bracket (see Code.gs's nameCandidates_), which never
  // contains just one of those two letters. Strips the marker(s) out for
  // display and reports them separately so the caller can badge the shirt
  // instead of showing "(P)"/"(C)" as if they were part of the name. Both
  // can be present on the same player (e.g. "Mbappé (P) (C)").
  function parsePlayerName(rawName) {
    var isPenalty = false;
    var isCaptain = false;
    var displayName = String(rawName || '').replace(/\(([^)]*)\)/g, function (match, inner) {
      var trimmed = inner.trim();
      if (/^p$/i.test(trimmed)) {
        isPenalty = true;
        return '';
      }
      if (/^c$/i.test(trimmed)) {
        isCaptain = true;
        return '';
      }
      return match;
    }).replace(/\s+/g, ' ').trim();
    return { displayName: displayName, isPenalty: isPenalty, isCaptain: isCaptain };
  }

  function renderLine(names, color) {
    var line = el('div', { class: 'pitch-line' });
    // Sheet order within a line is entered right-to-left (e.g. for
    // defenders, J2 = right-back ... J5 = left-back), but DOM/flexbox
    // order renders left-to-right, so reverse to match.
    names.slice().reverse().forEach(function (name) {
      var parsed = parsePlayerName(name);
      var chip = el('div', { class: 'player-chip' });
      var shirtWrap = el('div', { class: 'player-shirt-wrap' });
      shirtWrap.appendChild(shirtIcon(color));
      if (parsed.isCaptain) {
        shirtWrap.appendChild(el('img', {
          class: 'captain-badge',
          src: CAPTAIN_BADGE_SRC,
          alt: 'Capitaine'
        }));
      }
      if (parsed.isPenalty) {
        shirtWrap.appendChild(el('img', {
          class: 'penalty-badge',
          src: PENALTY_BADGE_SRC,
          alt: 'Tireur de penalty'
        }));
      }
      chip.appendChild(shirtWrap);
      chip.appendChild(el('span', { class: 'player-label', text: parsed.displayName }));
      line.appendChild(chip);
    });
    return line;
  }

  // orientation 'goal-top' (home team: own goal at the top of the shared
  // pitch, attacking downward toward the shared center) or 'goal-bottom'
  // (away team: own goal at the bottom, attacking upward toward the
  // center) -- ported from presentations' renderHalfPitch, replacing the
  // old per-team full-pitch renderPitch now that both teams in a match
  // share one continuous pitch (see renderMatchCard_).
  function renderHalfPitch(team, orientation) {
    var half = el('div', { class: 'pitch-half' });
    var joueurs = (team && team.joueurs) || [];
    var gk = joueurs[0];
    var outfield = joueurs.slice(1);
    var lines = parseFormationLines(team && team.formation);
    var sum = lines ? lines.reduce(function (a, b) { return a + b; }, 0) : 0;
    var color = TEAM_COLORS[team && team.equipe] || DEFAULT_SHIRT_COLOR;

    var groups = null;
    if (lines && sum === outfield.length) {
      var idx = 0;
      groups = lines.map(function (n) {
        var g = outfield.slice(idx, idx + n);
        idx += n;
        return g;
      });
    }

    var gkLine = renderLine(gk ? [gk] : [], GK_SHIRT_COLOR);
    if (orientation === 'goal-top') {
      half.appendChild(gkLine);
      if (groups) {
        groups.forEach(function (g) { half.appendChild(renderLine(g, color)); });
      } else if (outfield.length) {
        half.appendChild(renderLine(outfield, color));
      }
    } else {
      if (groups) {
        groups.slice().reverse().forEach(function (g) { half.appendChild(renderLine(g, color)); });
      } else if (outfield.length) {
        half.appendChild(renderLine(outfield, color));
      }
      half.appendChild(gkLine);
    }
    return half;
  }

  // Logo/name/formation, plus the <fc-team-form> last-5-results widget on
  // its own row below -- ported from presentations' renderTeamHeading_.
  // Team accuracy score is NOT here: it's drawn over the pitch's own
  // top-left/bottom-left corners instead (see renderMatchCard_), since
  // both teams now share one pitch rather than each having their own
  // header row to put it in.
  function renderTeamHeading_(team) {
    var heading = el('div', { class: 'team-header' });
    var top = el('div', { class: 'team-header-top' });
    var logoUrl = TEAM_LOGOS[team.equipe];
    if (logoUrl) {
      var logo = el('img', { class: 'team-logo', src: logoUrl, alt: team.equipe });
      logo.addEventListener('error', function () {
        this.replaceWith(el('span', { class: 'team-logo-fallback', text: teamInitials(team.equipe) }));
      });
      top.appendChild(logo);
    } else {
      top.appendChild(el('span', { class: 'team-logo-fallback', text: teamInitials(team.equipe) }));
    }
    // Code at mobile width (compact, next to the logo), full name at
    // desktop -- see .team-name-full/.team-name-short below.
    top.appendChild(el('span', { class: 'team-name team-name-short', text: TEAM_CODES[team.equipe] || team.equipe }));
    top.appendChild(el('span', { class: 'team-name team-name-full', text: TEAM_FULL_NAMES[team.equipe] || team.equipe }));
    if (team.formation) top.appendChild(el('span', { class: 'team-formation', text: team.formation }));
    heading.appendChild(top);
    heading.appendChild(el('fc-team-form', { team: team.equipe, league: 'L1' }));
    return heading;
  }

  // Pairs compos' per-team rows (each carrying its own fixture: opponent +
  // isHome + kickoff) into one match per home/away pair -- compos' API is
  // per-team, not per-match, so this is done client-side. Ported from
  // presentations' buildMatches_.
  function buildMatches_(teams) {
    var byName = {};
    (teams || []).forEach(function (t) { byName[t.equipe] = t; });
    var seen = {};
    var matches = [];
    (teams || []).forEach(function (t) {
      if (seen[t.equipe] || !t.fixture) return;
      var opponent = byName[t.fixture.opponent];
      seen[t.equipe] = true;
      if (opponent) seen[opponent.equipe] = true;
      var home = t.fixture.isHome ? t : opponent;
      var away = t.fixture.isHome ? opponent : t;
      if (!home || !away) return; // opponent's own row missing from this journée's data
      matches.push({ home: home, away: away, kickoff: t.fixture.kickoff });
    });
    matches.sort(function (a, b) { return new Date(a.kickoff) - new Date(b.kickoff); });
    return matches;
  }

  function renderMatchCard_(match, dnpByTeam) {
    var card = el('div', { class: 'match-card' });

    var d = new Date(match.kickoff);
    var when = isNaN(d.getTime()) ? '' : new Intl.DateTimeFormat('fr-FR', {
      weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Paris'
    }).format(d);
    if (when) card.appendChild(el('div', { class: 'match-kickoff', text: when.charAt(0).toUpperCase() + when.slice(1) }));

    var homeHeading = renderTeamHeading_(match.home);
    homeHeading.classList.add('team-heading-home');
    var awayHeading = renderTeamHeading_(match.away);
    awayHeading.classList.add('team-heading-away');
    var homeCapsule = renderDnpCapsule_(dnpByTeam[match.home.equipe]);
    homeCapsule.classList.add('team-capsule-home');
    var awayCapsule = renderDnpCapsule_(dnpByTeam[match.away.equipe]);
    awayCapsule.classList.add('team-capsule-away');

    var pitch = el('div', { class: 'pitch' });
    // Accuracy badges over the pitch's own corners -- home (drawn at the
    // top) top-left, away (drawn at the bottom) bottom-left -- rather than
    // in either heading row, since both teams now share this one pitch.
    if (match.home.score) {
      pitch.appendChild(el('span', {
        class: 'team-score pitch-score-home',
        text: match.home.score.correct + '/' + match.home.score.total
      }));
    }
    if (match.away.score) {
      pitch.appendChild(el('span', {
        class: 'team-score pitch-score-away',
        text: match.away.score.correct + '/' + match.away.score.total
      }));
    }
    pitch.appendChild(renderHalfPitch(match.home, 'goal-top'));
    pitch.appendChild(renderHalfPitch(match.away, 'goal-bottom'));

    var body = el('div', { class: 'match-body' });
    body.appendChild(homeHeading);
    body.appendChild(homeCapsule);
    body.appendChild(pitch);
    body.appendChild(awayCapsule);
    body.appendChild(awayHeading);
    card.appendChild(body);

    return card;
  }

  // "Journée 12" -> "Matchs du vendredi 5 septembre", grouped by Paris
  // calendar day and ordered chronologically — this is what actually
  // matters for lining up live substitutes match by match, rather than
  // scanning a flat grid for kickoff times.
  function dayGroupKey_(kickoffIso) {
    var d = new Date(kickoffIso);
    if (isNaN(d.getTime())) return null;
    var parts = {};
    new Intl.DateTimeFormat('fr-FR', {
      timeZone: 'Europe/Paris', year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
    }).formatToParts(d).forEach(function (p) { parts[p.type] = p.value; });
    if (!parts.year || !parts.month || !parts.day || !parts.weekday) return null;
    return {
      key: parts.year + '-' + parts.month + '-' + parts.day,
      label: 'Matchs du ' + parts.weekday.charAt(0).toUpperCase() + parts.weekday.slice(1) +
        ' ' + parts.day + ' ' + parts.month,
      date: d
    };
  }

  function groupMatchesByDay_(matches) {
    var byKey = {};
    var undated = [];
    matches.forEach(function (m) {
      var group = dayGroupKey_(m.kickoff);
      if (!group) { undated.push(m); return; }
      if (!byKey[group.key]) byKey[group.key] = { label: group.label, date: group.date, matches: [] };
      byKey[group.key].matches.push(m);
    });
    var days = Object.keys(byKey).map(function (k) { return byKey[k]; })
      .sort(function (a, b) { return a.date - b.date; });
    return { days: days, undated: undated };
  }

  function renderMatches_(matches, dnpByTeam) {
    matchList.innerHTML = '';
    if (!matches || matches.length === 0) {
      matchList.appendChild(el('div', { class: 'empty-state', text: 'Aucune composition disponible pour cette journée.' }));
      return;
    }

    var grouped = groupMatchesByDay_(matches);

    // No fixture data resolved for anyone (ligue1.fr unreachable, gameweek
    // number not resolvable, ...) — fall back to one flat list rather than
    // an awkward "Autres rencontres" heading with nothing else to contrast
    // it against.
    if (grouped.days.length === 0) {
      var flatList = el('div', { class: 'match-list' });
      matches.forEach(function (m) { flatList.appendChild(renderMatchCard_(m, dnpByTeam)); });
      matchList.appendChild(flatList);
      return;
    }

    grouped.days.forEach(function (day) {
      var section = el('section', { class: 'day-section' });
      section.appendChild(el('h2', { class: 'day-heading', text: day.label }));
      var list = el('div', { class: 'match-list' });
      day.matches.forEach(function (m) { list.appendChild(renderMatchCard_(m, dnpByTeam)); });
      section.appendChild(list);
      matchList.appendChild(section);
    });

    if (grouped.undated.length) {
      var section2 = el('section', { class: 'day-section' });
      section2.appendChild(el('h2', { class: 'day-heading', text: 'Autres rencontres' }));
      var list2 = el('div', { class: 'match-list' });
      grouped.undated.forEach(function (m) { list2.appendChild(renderMatchCard_(m, dnpByTeam)); });
      section2.appendChild(list2);
      matchList.appendChild(section2);
    }
  }

  function renderGameweekScore(score) {
    gameweekScoreEl.textContent = score ? score.percent + '%' : '';
  }

  // ISO datetime -> "dd/mm  HH:mm" in Europe/Paris, same locale/timezone
  // convention as renderMatchCard_/dayGroupKey_ above. null (no edit
  // recorded yet, or an unparseable value) clears the display entirely
  // rather than showing a broken timestamp.
  function formatLastUpdated_(iso) {
    var d = iso ? new Date(iso) : null;
    if (!d || isNaN(d.getTime())) return null;
    var parts = {};
    new Intl.DateTimeFormat('fr-FR', {
      timeZone: 'Europe/Paris', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false
    }).formatToParts(d).forEach(function (p) { parts[p.type] = p.value; });
    if (!parts.day || !parts.month || !parts.hour || !parts.minute) return null;
    return parts.day + '/' + parts.month + '  ' + parts.hour + ':' + parts.minute;
  }

  function renderLastUpdated(iso) {
    var formatted = formatLastUpdated_(iso);
    lastUpdatedEl.innerHTML = '';
    if (!formatted) return;
    lastUpdatedEl.appendChild(el('span', { text: 'Dernière mise à jour :' }));
    lastUpdatedEl.appendChild(el('span', { class: 'last-updated-time', text: formatted }));
  }

  // compos' journée labels are bare numbers ("1", "2", ...); DNP's are
  // "Journée N". Both fetched by the same selected number, so this page's
  // own picker options carry the bare number and this maps to DNP's shape
  // -- same convention as presentations' dnpJourneeLabel_.
  function dnpJourneeLabel_(number) {
    return 'Journée ' + number;
  }

  function loadJournee(journee) {
    setStatus('Chargement…');
    matchList.innerHTML = '';
    renderGameweekScore(null);
    renderLastUpdated(null);
    Promise.all([
      fetchJson_(API_BASE + '?journee=' + encodeURIComponent(journee), 3, 2000),
      fetchJson_(API_BASE_DNP + '?journee=' + encodeURIComponent(dnpJourneeLabel_(journee)), 3, 2000)
        .catch(function () { return { equipes: [] }; }) // DNP has nothing for this journée yet -- capsules just show "Aucun indisponible connu"
    ])
      .then(function (results) {
        var composData = results[0];
        var dnpData = results[1];
        if (composData && composData.error) throw new Error(composData.error);
        setStatus('');

        var dnpByTeam = {};
        (dnpData && dnpData.equipes || []).forEach(function (t) { dnpByTeam[t.equipe] = t.joueurs || []; });

        var matches = buildMatches_(composData.equipes);
        renderMatches_(matches, dnpByTeam);
        renderGameweekScore(composData.score);
        renderLastUpdated(composData.lastUpdated);
      })
      .catch(function (err) {
        setStatus('');
        matchList.appendChild(el('div', { class: 'error-state', text: 'Impossible de charger les données (' + err.message + ').' }));
      });
  }

  // jeu-des-pronos already tracks which Ligue 1 gameweek is current (locks
  // open/close around kickoffs); reuse that instead of guessing from
  // whichever journée happens to be filled in furthest — same approach as
  // l1.dnp.fantasy-coach.fr's frontend.
  var PRONOS_API_BASE = 'https://dmytkubjxwwwkroutvdu.supabase.co/functions/v1/api';
  var PRONOS_L1_LEAGUE_ID = '27f27a15-02a9-448a-98d5-80998e2fa52e';

  function fetchCurrentGameweekNumber() {
    return fetch(PRONOS_API_BASE + '/v1/leagues/' + PRONOS_L1_LEAGUE_ID + '/current')
      .then(function (r) { return r.json(); })
      .then(function (data) { return data && data.gameweek ? data.gameweek.number : null; })
      .catch(function () { return null; });
  }

  Promise.all([
    fetchJson_(API_BASE + '?meta=1', 3, 2000),
    fetchCurrentGameweekNumber()
  ])
    .then(function (results) {
      var journees = results[0];
      var currentNumber = results[1];
      select.innerHTML = '';
      journees.forEach(function (j) {
        select.appendChild(el('option', { value: j, text: j }));
      });
      select.disabled = false;
      select.addEventListener('change', function () { loadJournee(select.value); });

      // 'Compos' is free text a teammate fills in by hand -- observed to be
      // just "1", "2", ... this season rather than "Journée N" (same
      // tolerance as apps-script/Code.gs's gameweekNumberFromJournee_) -- so
      // match by extracted number, not by rebuilding a "Journée N" string
      // that would never equal a bare "3" and always fall through below.
      //
      // currentNumber is the *upcoming* gameweek per the pronos API (it
      // flips before that gameweek's Compos row has been filled in), so an
      // exact match is the uncommon case, not the rule: most of the time
      // the highest journée that's <= currentNumber is what should show,
      // and the page then jumps to currentNumber itself on its own, with
      // no code change, the moment that row gets added to the sheet.
      var numberedJournees = journees
        .map(function (j) { return { journee: j, number: parseInt(String(j).match(/\d+/), 10) }; })
        .filter(function (x) { return !isNaN(x.number); });
      var defaultJournee = null;
      if (currentNumber != null) {
        var eligible = numberedJournees.filter(function (x) { return x.number <= currentNumber; });
        eligible.sort(function (a, b) { return b.number - a.number; });
        if (eligible.length) defaultJournee = eligible[0].journee;
      }
      if (!defaultJournee) {
        // No usable currentNumber, or every available journée is somehow
        // ahead of it -- show the highest-numbered one rather than journée
        // 1. (orderedJourneeList_ on the Apps Script side returns sheet
        // row order, not necessarily numeric order, so pick explicitly
        // rather than assuming the last entry is the latest.)
        var highest = numberedJournees.slice().sort(function (a, b) { return b.number - a.number; })[0];
        defaultJournee = highest ? highest.journee : (journees.length ? journees[0] : null);
      }
      if (defaultJournee) {
        select.value = defaultJournee;
        loadJournee(defaultJournee);
      } else {
        select.appendChild(el('option', { text: 'Aucune journée disponible' }));
        select.disabled = true;
        matchList.appendChild(el('div', { class: 'empty-state', text: 'Aucune composition n’a encore été renseignée.' }));
      }
    })
    .catch(function (err) {
      select.innerHTML = '';
      select.appendChild(el('option', { text: 'Erreur de chargement' }));
      matchList.appendChild(el('div', { class: 'error-state', text: 'Impossible de charger la liste des journées (' + err.message + ').' }));
    });
})();
</script>
</body>
</html>
